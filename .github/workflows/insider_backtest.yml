name: Insider Form 4 백테스트 데이터 추출

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '단계 (기본 all)'
        required: true
        type: choice
        default: all
        options:
          - all
          - download
          - parse
          - fetch
          - build
          - verify

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Autotrade Research thebigone9414@gmail.com' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance pyarrow

      - name: Run pipeline
        env:
          MODE: ${{ github.event.inputs.mode }}
        working-directory: scripts/insider_backtest
        run: |
          case "$MODE" in
            all)       python run_all.py ;;
            download)  python download_form4.py ;;
            parse)     python parse_form4.py ;;
            fetch)     python fetch_prices.py ;;
            build)     python build_events.py ;;
            verify)    python verify.py ;;
            *)         echo "unknown mode"; exit 1 ;;
          esac

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-backtest-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: |
            scripts/insider_backtest/out/
            scripts/insider_backtest/logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit debug logs on failure
        if: failure()
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          mkdir -p scripts/insider_backtest/debug_logs
          # 각 로그 파일 뒤쪽 500줄만 (너무 크면 commit 느려짐)
          for f in scripts/insider_backtest/logs/*.log; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              tail -500 "$f" > "scripts/insider_backtest/debug_logs/$name"
            fi
          done
          # tsv 파일 샘플 저장 (실제 컬럼명 확인용)
          for d in scripts/insider_backtest/raw/*/; do
            tag=$(basename "$d")
            for tsv in SUBMISSION.tsv REPORTINGOWNER.tsv NONDERIV_TRANS.tsv; do
              if [ -f "$d$tsv" ]; then
                head -3 "$d$tsv" > "scripts/insider_backtest/debug_logs/${tag}_${tsv}_sample.tsv" 2>/dev/null || true
              fi
            done
            break   # 첫 분기만
          done
          git add scripts/insider_backtest/debug_logs/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "debug: insider_backtest 실패 로그 (run ${{ github.run_id }})"
            for i in 1 2 3; do
              git pull --rebase origin dev && git push origin dev && break
              sleep 3
            done
          fi
