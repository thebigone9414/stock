name: Insider Form 4 백테스트 데이터 추출

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '단계 (기본 all)'
        required: true
        type: choice
        default: all
        options:
          - all
          - download
          - parse
          - fetch
          - build
          - verify

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Autotrade Research thebigone9414@gmail.com' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance pyarrow

      - name: Run pipeline
        env:
          MODE: ${{ github.event.inputs.mode }}
        working-directory: scripts/insider_backtest
        run: |
          case "$MODE" in
            all)       python run_all.py ;;
            download)  python download_form4.py ;;
            parse)     python parse_form4.py ;;
            fetch)     python fetch_prices.py ;;
            build)     python build_events.py ;;
            verify)    python verify.py ;;
            *)         echo "unknown mode"; exit 1 ;;
          esac

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-backtest-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: |
            scripts/insider_backtest/out/
            scripts/insider_backtest/logs/
          retention-days: 30
          if-no-files-found: ignore
