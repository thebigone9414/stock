name: engine_v3 OHLCV 데이터 보강 (수동)

on:
  workflow_dispatch:

jobs:
  augment-engine-ohlcv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykrx pandas loguru

      - name: Augment ohlcv.csv.gz with missing codes
        run: python batch/augment_engine_ohlcv.py

      - name: Commit updated ohlcv.csv.gz
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          if git diff --quiet engine_v3/stockdata/ohlcv.csv.gz; then
            echo "no changes to commit"
          else
            git add engine_v3/stockdata/ohlcv.csv.gz
            git commit -m "data: engine_v3 ohlcv.csv.gz 누락 종목 보강 ($(date +%Y-%m-%d))"
            git push origin dev
          fi
