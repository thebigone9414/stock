# 자동매매 설정 (지시서 v2 기준, 2026-10-10)
# 모듈 A (ETF 11패턴) + 모듈 B (월말 모멘텀). 장중 손절·체크포인트 없음.

# ── 모듈별 자본 (장부 분리) ───────────────────────────────────────
# 평가자산 = 모듈 현금 + 보유 평가액. "복리" 플래그가 false 이면
# initial × 비중으로 매번 재계산 (사용자 선택: 고정 모드).
modules:
  A:
    initial:        25000000   # 모듈 A 시작 자본 (ETF 11패턴)
    long_frac:      0.20       # 롱 1건 = initial × 20% = 500만원
    short_frac:     0.40       # 숏 #11 = initial × 40% = 1,000만원
    max_positions:  5
    compound:       false      # false = 매번 initial 기준 재계산 (고정)
  B:
    initial:        10000000   # 모듈 B 시작 자본 (월말 모멘텀)
    top:            10         # 상위 N 종목 보유
    # 종목당 금액 = initial / top = 100만원 (compound=false 기준)
    stock_price_cap_ratio: 1.5   # 1주 가격이 종목당 금액 × 이 비율 초과면 건너뛰고 다음 순위
    compound:       false

# 공통
capital:
  min_cash_ratio: 0.5          # 현금이 건당 금액의 절반 이상이면 감액 매수

# ── 운용 수단 (ETF 코드) ─────────────────────────────────────────
etf:
  long_code:  "122630"         # KODEX 레버리지
  short_code: "114800"         # KODEX 인버스
  long_name:  "KODEX 레버리지"
  short_name: "KODEX 인버스"

# ── 지수 ────────────────────────────────────────────────────────
index:
  k200_code: "2001"            # 코스피200 (KIS 지수 코드)

# ── 하루 일정 (장중 손절 없음) ─────────────────────────────────────
schedule:
  reconcile_at: "08:20"
  sell_at:      "08:50"
  buy_at:       "15:21"
  decide_at:    "20:10"

# ── 데이터 ──────────────────────────────────────────────────────
data:
  engine_dir: "engine_v3"
  k200_csv:   "engine_v3/k200.csv"
  ohlcv_gz:   "engine_v3/stockdata/ohlcv.csv.gz"
  universe_sources:
    - "data/kospi200_cache.json"
    - "data/kosdaq150_cache.json"
  min_data_coverage_pct: 95
  max_daily_change_pct:  30

# ── 주문 ────────────────────────────────────────────────────────
order:
  max_buy_per_day:  15
  max_sell_per_day: 15
  min_buy_fill_ratio: 0.90

# ── 안전장치 ────────────────────────────────────────────────────
safety:
  # dry-run 플래그 — 초기 가동은 true. 10/13 수동 매수 기록 후 10/27까지 유지,
  # 10/27부터 false 로 전환해 실주문. 10/30 B 첫 교체는 실주문.
  dry_run: true
  dd_cutoff_A: 0.35            # 모듈 A 전고점 -35% → 신규 매수 중지
  dd_cutoff_B: 0.45            # 모듈 B 전고점 -45% → 신규 매수 중지
  stop_file_A: "autotrade/STOP_A"
  stop_file_B: "autotrade/STOP_B"

# ── 상태 파일 경로 ───────────────────────────────────────────────
paths:
  positions_A: "engine_v3/positions_v3.csv"
  positions_B: "engine_v3/positions_B.csv"
  orders_dir:  "autotrade/orders"
  state_dir:   "autotrade/state"
  trade_log:   "autotrade/trade_log.csv"       # 모듈 열 포함
  ledger_A:    "autotrade/ledger_A.csv"
  ledger_B:    "autotrade/ledger_B.csv"

# ── 텔레그램 ────────────────────────────────────────────────────
telegram:
  enabled: true
  # bot_token, chat_id는 config/settings.py에서 환경변수로 로드
